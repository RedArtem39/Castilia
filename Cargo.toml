[package]
name = "castilia"
version = "0.1.0"
edition = "2024"

[dependencies]
ureq = { version = "3.4", optional = true, features = ["charset", "cookies"] }
url = { version = "2.5", optional = true }
base64 = { version = "0.23", optional = true }

[dev-dependencies]
fontdb = "0.24"
fontdue = "0.9"
wuff = "0.2"
backtrace = "0.3"

[features]
default = ["jit"]
# Native code tier for hot JS functions. Builds without it are interpreter-only.
jit = []
host-net = ["dep:ureq", "dep:url", "dep:base64"]

[[example]]
name = "browse"
required-features = ["host-net"]

[[example]]
name = "bench"
required-features = ["host-net"]

[[example]]
name = "sitecheck"
required-features = ["host-net"]
